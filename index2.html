<!DOCTYPE html>

        .gallery {

            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }
        .gallery img {
            width: 100%;
            border-radius: 12px;
            border: 2px solid #d4af37;
